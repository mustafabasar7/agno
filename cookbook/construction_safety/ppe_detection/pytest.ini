[pytest]
# Pytest configuration for PPE Detection System tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 8.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (unregistered markers will raise error)
    --strict-markers
    # Warnings
    --strict-config
    # Coverage
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Performance
    --durations=10

# Test markers
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    slow: Tests that take significant time to run (>1 second)
    model: Tests that require ML model loading
    camera: Tests that involve camera/RTSP functionality
    database: Tests that require database operations
    api: Tests for API endpoints
    turkish: Tests for Turkish construction site scenarios
    performance: Performance and benchmark tests
    smoke: Smoke tests for quick validation

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

# Coverage HTML report
[coverage:html]
directory = htmlcov

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio mode
asyncio_mode = auto

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore specific warnings from third-party libraries
    ignore:.*YOLO.*:UserWarning
    ignore:.*cv2.*:DeprecationWarning

# Timeout (in seconds) for each test
timeout = 300

# Parallel execution
# Uncomment to enable parallel test execution
# addopts = -n auto

# Test output
console_output_style = progress

# JUnit XML output
junit_family = xunit2
