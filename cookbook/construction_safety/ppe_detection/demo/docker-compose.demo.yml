version: '3.8'

services:
  # PPE Detection Demo API
  ppe-demo-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ppe-demo-api
    environment:
      - ENVIRONMENT=demo
      - DEBUG=false
      - DATABASE_URL=postgresql://ppe_user:ppe_password@demo-db:5432/ppe_detection_demo
      - REDIS_URL=redis://demo-redis:6379/0
      - MODEL_PATH=/app/models/yolov8n.pt
      - DEVICE=cpu
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ./data:/app/demo_data:ro
      - ./output:/app/output
    depends_on:
      - demo-db
      - demo-redis
    networks:
      - demo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Demo Dashboard
  ppe-demo-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ppe-demo-dashboard
    environment:
      - FLASK_ENV=production
      - API_URL=http://ppe-demo-api:8000
    ports:
      - "5000:5000"
    networks:
      - demo-network
    restart: unless-stopped
    depends_on:
      - ppe-demo-api

  # PostgreSQL Database
  demo-db:
    image: postgres:15-alpine
    container_name: ppe-demo-db
    environment:
      - POSTGRES_USER=ppe_user
      - POSTGRES_PASSWORD=ppe_password
      - POSTGRES_DB=ppe_detection_demo
    ports:
      - "5432:5432"
    volumes:
      - demo-db-data:/var/lib/postgresql/data
      - ./init-demo-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - demo-network
    restart: unless-stopped

  # Redis Cache
  demo-redis:
    image: redis:7-alpine
    container_name: ppe-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - demo-redis-data:/data
    networks:
      - demo-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Demo Data Generator
  demo-data-generator:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    container_name: ppe-demo-datagen
    environment:
      - API_URL=http://ppe-demo-api:8000
      - INTERVAL=10
    networks:
      - demo-network
    depends_on:
      - ppe-demo-api
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  demo-nginx:
    image: nginx:alpine
    container_name: ppe-demo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - demo-network
    depends_on:
      - ppe-demo-api
      - ppe-demo-dashboard
    restart: unless-stopped

volumes:
  demo-db-data:
    driver: local
  demo-redis-data:
    driver: local

networks:
  demo-network:
    driver: bridge
