name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ppe-detection

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT_SHA=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://ppe-detection-staging.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying version: ${{ needs.build-and-push.outputs.version }}"
        echo "Tags: ${{ needs.build-and-push.outputs.tags }}"
        # Add your deployment commands here
        # Examples:
        # - kubectl set image deployment/ppe-detection ppe-detection=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        # - docker-compose -f docker-compose.staging.yml up -d
        # - ssh user@staging-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest && docker-compose up -d"

    - name: Configure deployment environment
      run: |
        echo "Setting up staging environment variables..."
        # Configure staging-specific settings

    - name: Run database migrations
      run: |
        echo "Running database migrations..."
        # Add migration commands here
        # docker-compose exec -T app alembic upgrade head

  smoke-tests-staging:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install test dependencies
      run: |
        pip install requests pytest

    - name: Run smoke tests
      env:
        STAGING_URL: https://ppe-detection-staging.example.com
      run: |
        # Add smoke test commands
        echo "Running smoke tests against staging..."
        # pytest tests/smoke/ --base-url=$STAGING_URL

        # Basic health check
        curl -f $STAGING_URL/health || exit 1
        echo "Staging health check passed!"

    - name: Test critical endpoints
      env:
        STAGING_URL: https://ppe-detection-staging.example.com
      run: |
        echo "Testing critical API endpoints..."
        # Test API endpoints
        # curl -f $STAGING_URL/api/v1/detect || exit 1

  deploy-production-approval:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: smoke-tests-staging
    environment:
      name: production-approval

    steps:
    - name: Manual approval checkpoint
      run: |
        echo "Production deployment approved!"
        echo "Version: ${{ needs.build-and-push.outputs.version }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-production-approval]
    environment:
      name: production
      url: https://ppe-detection.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment notification
      run: |
        echo "🚀 Starting production deployment..."
        echo "Version: ${{ needs.build-and-push.outputs.version }}"
        echo "Commit: ${{ github.sha }}"

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your production deployment commands here
        # kubectl set image deployment/ppe-detection ppe-detection=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --namespace=production

    - name: Run database migrations
      run: |
        echo "Running database migrations..."
        # Add migration commands

    - name: Warm up application
      run: |
        echo "Warming up application..."
        sleep 10

  smoke-tests-production:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run production smoke tests
      env:
        PRODUCTION_URL: https://ppe-detection.example.com
      run: |
        echo "Running smoke tests against production..."
        curl -f $PRODUCTION_URL/health || exit 1
        echo "Production health check passed!"

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production deployment successful!"
        else
          echo "❌ Production deployment failed!"
        fi
        # Add notification logic (Slack, email, etc.)

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-production, smoke-tests-production]
    environment:
      name: production-rollback

    steps:
    - name: Rollback deployment
      run: |
        echo "Rolling back deployment..."
        # Add rollback commands
        # kubectl rollout undo deployment/ppe-detection --namespace=production
